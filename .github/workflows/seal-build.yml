name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GO111MODULE: 'off'
        run: go build -v .

      - name: Pack module zip
        run: |
          set -euo pipefail
          # Copy the module tree without the .github directory this workflow adds
          # (upstream ships none), then zip it with Go's own module-zip implementation.
          mkdir -p "$RUNNER_TEMP/modsrc" "$RUNNER_TEMP/packer" dist
          rsync -a --exclude .git --exclude .github ./ "$RUNNER_TEMP/modsrc/"
          cd "$RUNNER_TEMP/packer"
          cat > main.go <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
          }
          EOF
          go mod init example.com/packer
          go get golang.org/x/mod@v0.14.0
          go run . github.com/Masterminds/goutils v1.1.0 "$RUNNER_TEMP/modsrc" "$GITHUB_WORKSPACE/dist/v1.1.0.zip"
          unzip -l "$GITHUB_WORKSPACE/dist/v1.1.0.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: go-module-zip
          path: dist/v1.1.0.zip
